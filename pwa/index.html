<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Encryption App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <h1>PWA OTP test App</h1>
        <div class="form-group">
            <label for="password">PIN:</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button id="encryptBtn">Ввести</button>
        <div class="result">
            <h3>Результат:</h3>
            <pre id="output"></pre>
        </div>
    </div>
    <p id="service-worker-status">Статус service-worker'a</p>
    <p id="app-worker-status">Сервис работает без ошибок</p>
    <script src="app.js"></script>
</body>
</html>
